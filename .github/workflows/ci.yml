name: Scientific release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-science:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra dev --extra splitter-oracle --python 3.12
      - run: uv run --no-sync python scripts/verify_release.py
      - run: uv run --no-sync ruff check src tests scripts experiments
      - run: uv run --no-sync mypy src/model_lab
      - run: uv run --no-sync pytest -q --junitxml=test-results.xml
      - run: uv run --no-sync python experiments/synthetic.py
      - run: uv build --quiet
      - name: Install wheel in isolated environment and test actual installed models
        run: |
          uv venv wheel-env --python 3.12
          uv pip install --python wheel-env/bin/python dist/*.whl pytest skfolio timeseriescv
          wheel-env/bin/python -c "import model_lab; assert 'site-packages' in model_lab.__file__, model_lab.__file__"
          wheel-env/bin/python -m pytest -q tests/unit/vol tests/unit/tail tests/unit/changepoint tests/unit/regime tests/unit/anomaly tests/unit/eval tests/unit/splitter tests/unit/research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            test-results.xml
            dist/*
  history-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified scanner and scan complete public history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.24.3 --repo gitleaks/gitleaks --pattern 'gitleaks_8.24.3_linux_x64.tar.gz' --pattern 'gitleaks_8.24.3_checksums.txt' --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          sha256sum --check --ignore-missing gitleaks_8.24.3_checksums.txt
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts=--all --redact --no-banner
